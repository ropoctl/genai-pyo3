[package]
name = "genai-pyo3"
version = "0.7.0-beta.19.dev0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Python bindings for rust-genai"

[lib]
name = "_genai_pyo3"
crate-type = ["cdylib"]

[dependencies]
# Pinned to a ropoctl fork branch (`ropoctl-stack`), not upstream, while five
# PRs sent to jeremychone/rust-genai are in review. The branch is upstream
# main (0.7.0-beta.19-WIP) plus exactly those five commits:
#
#   #285  ChatOptions.stop_sequences serde default (partial dict deser)
#   #286  AdapterKind::all()
#   #287  Error::status() / webc::Error::status()
#   #288  all_model_names must honour the ServiceTargetResolver
#   #289  ClientBuilder::with_provider_config
#
# Repin to an upstream rev once they land; the fork branch exists only to
# avoid carrying local workarounds for fixes that are already written.
genai = { git = "https://github.com/ropoctl/rust-genai", rev = "ccccfb2a306a2f105a80cc4fc2e1855c21845440" }
pyo3 = { version = "0.28", features = ["extension-module"] }
pyo3-async-runtimes = { version = "0.28", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
futures = "0.3"
serde_json = "1"
pythonize = "0.28"
# We need `reqwest::header::{HeaderMap, HeaderName, HeaderValue}` to hand
# custom default headers through to rust-genai's `WebConfig`. rust-genai
# already depends on reqwest 0.13 with "json", "stream", "gzip"; we take
# it here with `default-features = false` since we only use its header
# types, and the shared version resolves to the same compiled crate.
reqwest = { version = "0.13", default-features = false }
